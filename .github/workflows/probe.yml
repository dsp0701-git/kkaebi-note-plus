name: probe-sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python
        run: |
          import re, time
          from curl_cffi import requests as r
          def get(u):
            time.sleep(1)
            x = r.get(u, impersonate="chrome", timeout=20)
            return x.status_code, x.text
          def show(u, body):
            titles = re.findall(r'"title"\s*:\s*"([^"]{4,90})"', body) or re.findall(r'"([^"]{6,90}(?:안내|점검|이벤트)[^"]{0,20})"', body)
            print(f"  post_id={body.count('post_id')} titles={len(titles)}")
            for t in titles[:12]: print("   *", t)
          pages = [
            "https://m-forum.kakaogames.com/dokkaebi/",
            "https://m-forum.kakaogames.com/dokkaebi/postList/?code=notice",
            "https://forum.kakaogames.com/dokkaebi/postList/?code=notice",
            "https://dokkaebi.kakaogames.com/",
          ]
          for u in pages:
            try:
              s, body = get(u)
              print(f"\n=== {s} {u} len={len(body)}"); show(u, body)
              for p in sorted(set(re.findall(r'(?:https://[a-z.-]+kakaogames\.com)?/[a-z/]*_payload\.json\?_b=[0-9a-f-]+', body))):
                pu = p if p.startswith("http") else re.match(r"https://[^/]+", u).group(0) + p
                s2, b2 = get(pu)
                print(f"  [payload] {s2} {pu} len={len(b2)}"); show(pu, b2)
            except Exception as e:
              print(f"\n=== ERR {u}: {e}")
          # bbs SPA: API 호스트 찾기
          try:
            s, body = get("https://bbs.kakaogames.com/ko/1329429/notice/list")
            for js in re.findall(r'src="(/[0-9a-f]+\.js)"', body)[:8]:
              s2, b2 = get("https://bbs.kakaogames.com" + js)
              apis = sorted(set(re.findall(r'https?://[a-z0-9.-]+\.kakaogames\.com[/a-zA-Z0-9_.{}$-]*', b2)))
              if apis: print(f"\n[bbs js] {js}:", apis[:15])
          except Exception as e:
            print("bbs ERR", e)
