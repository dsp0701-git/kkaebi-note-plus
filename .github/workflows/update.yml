name: update-data

on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다(UTC 기준, 정각 혼잡 피해서 17분)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    paths: ["scripts/**", "data/config.json"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test parsers
        run: python -m unittest discover tests

      - name: Diag forum-api (임시)
        continue-on-error: true
        run: |
          U="https://forum-api.kakaogames.com/v1/dokkaebi/boards/notice/list?size=1&lang=ko"
          curl -sS -i -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "$U" | head -c 1500; echo
          pip install -q curl_cffi && python -c "from curl_cffi import requests as r; x=r.get('$U', impersonate='chrome'); print('cffi', x.status_code, x.headers.get('server'), x.text[:200])"

      - name: Fetch data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # 없으면 RSS만 사용
        run: python scripts/update.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/auto.json; then
            echo "no changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto.json
          git commit -m "data: auto update $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
