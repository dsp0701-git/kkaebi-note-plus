name: update-data

on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다(UTC 기준, 정각 혼잡 피해서 17분)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    paths: ["scripts/**", "data/config.json", "data/forum_cache.json"]  # forum_cache: 커뮤니티 방문 시 브라우저(tools/kkaebi-sync.user.js)가 올림

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test parsers
        run: python -m unittest discover tests

      - name: Install deps
        run: pip install -q curl_cffi   # 공식 커뮤니티 API 가 기본 파이썬 TLS 를 403 으로 막아서 필요

      - name: Fetch data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # 없으면 RSS만 사용
        run: python scripts/update.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/auto.json data/equip.json; then
            echo "no changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto.json data/equip.json
          git commit -m "data: auto update $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
